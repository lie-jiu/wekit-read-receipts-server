<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    图形 = 已读回执本身：消息气泡 + 勾，对应产品「读没读」这一件事。
    颜色取 parchment 档的 primary（浅色 #202116 近黑 / 深色 #C4B8A8 暖米），
    刻意单色：本站把红绿橙留给已读/异常语义，品牌不占色相（见 src/flows/shared/theme.ts）。
    不支持 SVG 内 @media 的浏览器会停在浅色档 —— 深底浅图，明暗两种 tab 条都站得住。
  -->
  <style>
    .tile { fill: #202116 }
    .bubble { fill: #faf9f6 }
    .tick { fill: none; stroke: #202116; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #c4b8a8 }
      .bubble { fill: #1a1814 }
      .tick { stroke: #c4b8a8 }
    }
  </style>

  <rect class="tile" width="32" height="32" rx="7" />

  <rect class="bubble" x="4.6" y="5.6" width="19" height="14.4" rx="3.8" />
  <!-- 尾巴与气泡同色且顶部重叠，圆角矩形被它压住左下角，接缝看不见 -->
  <path class="bubble" d="M8.6 18.6h7l-5.7 6.8c-.7.8-1.3.4-1.3-.7z" />

  <path class="tick" d="M8.8 12.6l4 3.8 6.6-7.2" />
</svg>
