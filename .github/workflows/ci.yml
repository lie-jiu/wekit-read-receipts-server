name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # 固定版本：latest 漂移曾导致 CI 与本地行为不一致（文件执行顺序差异被放大）
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 双运行时类型检查：Bun（根 tsconfig）+ Cloudflare Workers（worker/tsconfig.json）
      - name: Typecheck
        run: bun run typecheck

      # SPA 是独立工程（自己的 lockfile/node_modules），且被根 tsconfig 排除，
      # 不在这里检查就完全没有门禁 —— 它同时是下面 Wrangler dry-run 的前置：
      # wrangler.jsonc 的 assets.directory 指向 dist，而 dist 不进版本库。
      - name: Install web dependencies
        working-directory: wekit-read-insights
        run: bun install --frozen-lockfile

      - name: Typecheck SPA
        run: bun run web:typecheck

      - name: Build SPA
        run: bun run web:build

      - name: Test
        run: bun test

      # 只校验 Workers 构建可打包、不上传；防止改动悄悄破坏 Cloudflare 部署目标
      - name: Wrangler dry-run
        run: bun run check:cf
        env:
          WRANGLER_SEND_METRICS: "false"
